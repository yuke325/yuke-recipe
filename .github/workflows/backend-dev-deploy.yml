name: Deploy Backend to Cloud Run

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - 'backend/**'

jobs:
  job_id:
    runs-on: ubuntu-latest

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - uses: 'actions/checkout@v4'

    - uses: 'google-github-actions/auth@v3'
      with:
        project_id: 'recipe-dev-4920005'
        workload_identity_provider: 'projects/905727208796/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions'
        service_account: 'github-actions-348@recipe-dev-492005.iam.gserviceaccount.com'

    - name: Check Auth
      run: gcloud auth list
